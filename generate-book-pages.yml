name: Generate book share pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'scripts/generate-book-pages.js'
      - '.github/workflows/generate-book-pages.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate book pages from Firebase
        run: node scripts/generate-book-pages.js

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/
          git diff --cached --quiet && echo "No book page changes" || git commit -m "Update book share pages"
          git push
