name: Generate book share pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main, master]
    paths:
      - 'generate-book-share-pages.py'
      - '.github/workflows/generate-book-share-pages.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate pages from Firebase
        env:
          FIREBASE_DATABASE_URL: https://saeid-elshwadfy-default-rtdb.firebaseio.com
          SITE_URL: https://saeid-elshwadfy.github.io
        run: python generate-book-share-pages.py

      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update book share pages [skip ci]'
          git push
